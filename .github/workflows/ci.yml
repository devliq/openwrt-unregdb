name: feed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake make gcc gzip binutils fakeroot shellcheck
          shellcheck install.sh scripts/*.sh

      - name: Restore signing keys
        env:
          USIGN_SECRET_B64: ${{ secrets.USIGN_SECRET_B64 }}
          APK_SIGN_KEY_B64: ${{ secrets.APK_SIGN_KEY_B64 }}
        run: |
          [ -n "$USIGN_SECRET_B64" ] || { echo "missing USIGN_SECRET_B64"; exit 1; }
          [ -n "$APK_SIGN_KEY_B64" ] || { echo "missing APK_SIGN_KEY_B64"; exit 1; }
          mkdir -p keys/private
          printf '%s' "$USIGN_SECRET_B64" | base64 -d > keys/private/unregdb.sec
          printf '%s' "$APK_SIGN_KEY_B64" | base64 -d > keys/private/unregdb-apk.key
          chmod 600 keys/private/*

      - name: Build feed
        run: make feed

      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "feed unchanged"
            exit 0
          fi
          git commit -m "chore(feed): rebuild $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
